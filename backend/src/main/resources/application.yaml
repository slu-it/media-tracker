# Runtime configuration. Every secret comes from the environment (see deploy/env.example);
# nothing sensitive is baked into the JAR. Syntax: "$VAR" is required, "$VAR:default" is optional.
ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - de.sluit.mediatracker.ApplicationKt.module

database:
  url: "$DB_URL"
  user: "$DB_USER"
  password: "$DB_PASSWORD"
  # HikariCP. The keepalive dates from the web-host era, where idle connections were killed from the other
  # side; against the Pi's local MariaDB (decision record 0018) it is harmless rather than necessary.
  pool:
    maximumPoolSize: 3
    minimumIdle: 1
    keepaliveTime: 300000
    maxLifetime: 1500000

session:
  cookieName: MT_SESSION
  # 14 days. Sessions live in the `sessions` table; the cookie carries only the signed session id.
  maxAgeSeconds: 1209600
  # Set SESSION_SECURE=false only for plain-http local testing.
  secureCookie: "$SESSION_SECURE:true"
  # HMAC key used to sign the session id cookie. Any long random string (>= 32 chars).
  secret: "$SESSION_SECRET"

coverSource:
  steamGridDb:
    # Optional. Without it, GET /api/games/cover-options answers 503 and the cover picker is unavailable.
    # Set it to enable searching SteamGridDB for cover art (MT-017).
    apiKey: "$STEAMGRIDDB_API_KEY:"
    baseUrl: "https://www.steamgriddb.com/api/v2"

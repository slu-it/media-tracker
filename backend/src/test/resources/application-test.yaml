# Test configuration: in-memory H2 in MySQL compatibility mode, plain-http cookie.
# `ktor.application.modules` is intentionally absent; tests call `module()` explicitly.
ktor:
  deployment:
    port: 8080

database:
  url: "jdbc:h2:mem:media_tracker_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
  user: "sa"
  password: ""
  pool:
    maximumPoolSize: 2
    minimumIdle: 1
    keepaliveTime: 30000
    maxLifetime: 60000
  migration:
    timestampType: "TIMESTAMP(9)"

session:
  cookieName: MT_SESSION
  maxAgeSeconds: 3600
  secureCookie: false
  secret: "test-secret-test-secret-test-secret"

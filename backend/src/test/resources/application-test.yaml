# Test configuration: the Testcontainers MariaDB shared by the whole test JVM, plain-http cookie.
# `ktor.application.modules` is intentionally absent; tests call `module()` explicitly.
ktor:
  deployment:
    port: 8080

database:
  # Dummy values: TestApp.appWithUser overrides url/user/password with the running container's coordinates
  # (see common/persistence/TestDatabase.kt#testDatabaseConfig) before module() runs.
  url: "jdbc:mariadb://overridden-by-testapp/media_tracker_test"
  user: "overridden-by-testapp"
  password: "overridden-by-testapp"
  pool:
    maximumPoolSize: 2
    minimumIdle: 1
    keepaliveTime: 30000
    maxLifetime: 60000

session:
  cookieName: MT_SESSION
  maxAgeSeconds: 3600
  secureCookie: false
  secret: "test-secret-test-secret-test-secret"

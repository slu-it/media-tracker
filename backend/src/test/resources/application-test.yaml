# Test configuration: the Testcontainers MariaDB shared by the whole test JVM, plain-http cookie.
# `ktor.application.modules` is intentionally absent; tests call `module()` explicitly.
ktor:
  deployment:
    port: 8080

database:
  # Dummy values: TestApp.appWithUser overrides url/user/password with the running container's coordinates
  # (see common/persistence/TestDatabase.kt#testDatabaseConfig) before module() runs.
  url: "jdbc:mariadb://overridden-by-testapp/media_tracker_test"
  user: "overridden-by-testapp"
  password: "overridden-by-testapp"
  pool:
    maximumPoolSize: 2
    minimumIdle: 1
    keepaliveTime: 30000
    maxLifetime: 60000

session:
  cookieName: MT_SESSION
  maxAgeSeconds: 3600
  secureCookie: false
  secret: "test-secret-test-secret-test-secret"

coverSource:
  steamGridDb:
    # Pinned empty so a developer's exported STEAMGRIDDB_API_KEY cannot flip the cover-source-unavailable smoke test.
    apiKey: ""
    baseUrl: "https://www.steamgriddb.com/api/v2"

bookCoverSource:
  # Unreachable on purpose (port 9, discard): tests never call the real providers, so the smoke path of the book
  # cover endpoints is a 502 and title suggestions degrade to an empty list.
  openLibrary:
    baseUrl: "http://127.0.0.1:9"
    coversBaseUrl: "http://127.0.0.1:9"
    userAgent: "media-tracker (self-hosted)"
  audible:
    marketplace: "de"
    baseUrl: "http://127.0.0.1:9"

dropbox:
  # Pinned empty so a developer's exported DROPBOX_APP_KEY/SECRET cannot flip the dropbox-unavailable smoke test.
  appKey: ""
  appSecret: ""

backup:
  # Pinned to the production defaults; the scheduler tests build their own BackupConfig instead of going
  # through this file, so nothing here is time-sensitive.
  dailyAt: "03:00"
  zone: "Europe/Berlin"

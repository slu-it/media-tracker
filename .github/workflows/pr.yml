# Pull request verification: `./gradlew build` is the single contract locally (see README) and runs
# ktlint, ESLint, the Prettier check, backend tests (Testcontainers MariaDB, Docker is available on ubuntu-latest), frontend tests (Vitest) and assembles the JAR.
# CI splits it over two parallel jobs so the frontend tests do not compete for CPU with the backend tests:
# `:frontend:build` (ESLint, Prettier check, Vitest, Vite build) and `:backend:build` (ktlint, backend tests,
# JAR incl. the SPA); their union is exactly `./gradlew build`. The PR is green only if both jobs pass.
# The backend job also builds the container image and boots it against a MariaDB container, without pushing:
# publishing happens in `master.yml`.
name: PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going for the previous commit.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # On non-default branches the cache is read-only, so PRs reuse what master builds have stored.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Node, pnpm and the pnpm store
        uses: actions/cache@v6
        with:
          path: |
            frontend/.gradle/nodejs
            frontend/.gradle/pnpm
            ~/.local/share/pnpm/store
          key: node-pnpm-${{ runner.os }}-${{ hashFiles('frontend/build.gradle.kts', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            node-pnpm-${{ runner.os }}-

      # pnpm sees CI=true and installs with --frozen-lockfile, so a stale pnpm-lock.yaml fails the build.
      - name: Lint, format check, test and build
        run: ./gradlew :frontend:build

      - name: Upload frontend reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-reports
          path: |
            frontend/build/test-results/
            frontend/build/coverage/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Build, lint and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches ~/.gradle (dependencies, wrapper, build cache) and validates the wrapper JAR checksum.
      # On non-default branches the cache is read-only, so PRs reuse what master builds have stored.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Node and pnpm are downloaded by the Gradle build into frontend/.gradle; the pnpm store holds the
      # npm packages. Keyed on the files that pin their versions.
      - name: Cache Node, pnpm and the pnpm store
        uses: actions/cache@v6
        with:
          path: |
            frontend/.gradle/nodejs
            frontend/.gradle/pnpm
            ~/.local/share/pnpm/store
          key: node-pnpm-${{ runner.os }}-${{ hashFiles('frontend/build.gradle.kts', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            node-pnpm-${{ runner.os }}-

      # The backend build also runs the Vite build for the SPA it packages (frozen lockfile as above).
      - name: Build, lint and test backend
        run: ./gradlew :backend:build

      # The image is only published from master.yml; here we make sure the Dockerfile still builds and that the
      # JAR boots on the distroless JRE as uid 65532 with a read-only root fs. The database is the local-dev
      # MariaDB from the root docker-compose.yml (its image is already in the daemon cache from the Testcontainers
      # tests); --network host lets the container reach its 127.0.0.1:3306 binding.
      - name: Build container image
        run: docker build -t media-tracker:pr .

      - name: Smoke-run the image
        run: |
          docker compose up -d --wait mariadb
          docker run -d --name media-tracker --network host --read-only --tmpfs /tmp \
            -e DB_URL='jdbc:mariadb://127.0.0.1:3306/mediatracker?sslMode=disable&timezone=UTC&preserveInstants=true' \
            -e DB_USER=mediatracker -e DB_PASSWORD=mediatracker \
            -e SESSION_SECRET=ci-smoke-only-secret-not-for-production -e SESSION_SECURE=false \
            media-tracker:pr
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' media-tracker 2>/dev/null)" != "true" ]; then
              echo "::error::the container exited before /health answered"
              exit 1
            fi
            sleep 2
          done
          echo "::error::/health did not answer within 60 s"
          exit 1

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs media-tracker 2>&1 | tail -n 100 || true
          docker rm -f media-tracker || true
          docker compose down -v || true

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

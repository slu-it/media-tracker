# Master build: same verification as the PR workflow, then the fat JAR is kept as a workflow artifact.
# Deploying it to the Pi stays manual (see README "Deploy to the Pi").
name: Master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master
  cancel-in-progress: false

jobs:
  build:
    name: Build and archive fat JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # On the default branch the Gradle cache is writable; PR builds read from it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Node, pnpm and the pnpm store
        uses: actions/cache@v6
        with:
          path: |
            frontend/.gradle/nodejs
            frontend/.gradle/pnpm
            ~/.local/share/pnpm/store
          key: node-pnpm-${{ runner.os }}-${{ hashFiles('frontend/build.gradle.kts', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            node-pnpm-${{ runner.os }}-

      # --max-workers=2: the hosted runner has few cores and the frontend tests (Vitest, capped to 3 workers via
      # CI=true) run in parallel with the backend build and tests.
      - name: Build, lint and test
        run: ./gradlew build --max-workers=2

      - name: Archive fat JAR
        uses: actions/upload-artifact@v7
        with:
          name: media-tracker-jar
          path: backend/build/libs/media-tracker.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

# Local development database. Used by build-and-start-locally.sh; not part of the Pi deployment.
#
#   docker compose up -d --wait      start (idempotent) and wait until MariaDB accepts connections
#   docker compose down              stop, keep data
#   docker compose down -v           stop and delete the data volume

services:
  mariadb:
    image: mariadb:11.8
    container_name: media-tracker-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mediatracker
      MARIADB_USER: mediatracker
      MARIADB_PASSWORD: mediatracker
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mariadb-data:
